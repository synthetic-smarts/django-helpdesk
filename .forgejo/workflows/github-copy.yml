# Generated by .claude/skills/synadmin-github-copy/copy_workflow.py (synthetic-smarts); do not edit.
# Implements ADR-0312 §8: pushes this repository's protected branches and tags to its
# read-only GitHub copy with a one-repository mirror App token from the credential broker.
name: github-copy

on:
  push:
    branches: [main]
  schedule:
    - cron: "*/15 * * * *"

# A newer push or schedule queues behind a running copy instead of cancelling it.
concurrency:
  cancel-in-progress: false

jobs:
  copy:
    runs-on: ${{ vars.CI_RUNNER_FLEET == 'azure' && 'synsmarts-arm64-az' || 'synsmarts-arm64-long' }}
    timeout-minutes: 15
    enable-openid-connect: true
    env:
      BROKER: https://prod-credential-broker.internal.synsmarts.io
      BINDING: github-copy-django-helpdesk
      GITHUB_API: https://api.github.com
      COPY_URL: https://github.com/synthetic-smarts/django-helpdesk.git
      SOURCE_URL: ${{ github.server_url }}/synthetic-smarts/django-helpdesk.git
      REFSPECS: refs/heads/main:refs/heads/main
    steps:
      - name: Tools on the host-mode runner
        shell: bash
        run: git --version && python3 --version && curl --version | head -1
      - name: Copy protected branches and tags to GitHub
        if: vars.FORGE_SHADOW != 'true'
        shell: bash
        env:
          FORGEJO_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          umask 077
          work="$(mktemp -d)"
          trap 'rm -rf "$work"' EXIT
          auth() { printf 'Authorization: Basic %s' "$(printf 'x-access-token:%s' "$1" | base64 | tr -d '\n')"; }
          since="$(date +%s)"
          mark() { now="$(date +%s)"; echo "github-copy: $1 in $((now - since))s"; since="$now"; }
          objects() { git count-objects -v | awk '$1 == "count:" || $1 == "in-pack:" { n += $2 } END { print n + 0 }'; }

          # The mirror App token for this one copy, from the broker (ADR-0315).
          token="$(python3 - <<'PY'
          import json, os, urllib.parse, urllib.request
          env = os.environ
          parts = urllib.parse.urlsplit(env["ACTIONS_ID_TOKEN_REQUEST_URL"])
          query = urllib.parse.parse_qsl(parts.query) + [("audience", f"{env['BROKER']}/b/{env['BINDING']}")]
          request = urllib.request.Request(urllib.parse.urlunsplit(parts._replace(query=urllib.parse.urlencode(query))),
                                           headers={"Authorization": "bearer " + env["ACTIONS_ID_TOKEN_REQUEST_TOKEN"]})
          with urllib.request.urlopen(request, timeout=30) as response:
              oidc = json.load(response)["value"]
          body = json.dumps({"binding_id": env["BINDING"], "token": oidc}).encode()
          request = urllib.request.Request(env["BROKER"] + "/v1/release", data=body, method="POST",
                                           headers={"Content-Type": "application/json"})
          with urllib.request.urlopen(request, timeout=30) as response:
              print(json.load(response)["credentials"]["gh_token"])
          PY
          )"
          echo "::add-mask::$token"
          revoke() { curl -fsS -o /dev/null -X DELETE -H "Authorization: Bearer $token" \
            -H 'Accept: application/vnd.github+json' "$GITHUB_API/installation/token" || true; rm -rf "$work"; }
          trap revoke EXIT
          mark "mirror token released"

          # Tokens reach git through the environment, never argv: the job's own repository
          # token for Forgejo, the mirror App token for the copy.
          git init -q --bare "$work/repo"
          export GIT_DIR="$work/repo" GIT_TERMINAL_PROMPT=0 GIT_CONFIG_COUNT=2
          export GIT_CONFIG_KEY_0="http.$SOURCE_URL.extraHeader" GIT_CONFIG_KEY_1="http.$COPY_URL.extraHeader"
          GIT_CONFIG_VALUE_0="$(auth "$FORGEJO_TOKEN")"; export GIT_CONFIG_VALUE_0
          GIT_CONFIG_VALUE_1="$(auth "$token")"; export GIT_CONFIG_VALUE_1

          # The copy's own tips, one commit deep: the fetch from Forgejo negotiates from them
          # and takes only what the copy lacks, where an empty repository took every branch's
          # whole history (synthetic-smarts#7068: run 4686 spent 102 s on that for one
          # promotion-journal row). A copy with no refs yet takes the whole history. The tips'
          # commits come from Forgejo, which holds every commit the copy was given, beside the
          # runner; one Forgejo lacks (a diverged copy, a moved tag) comes from the copy, whose
          # snapshots cross the internet (run 4812 took 66 s reading both from GitHub).
          git ls-remote "$COPY_URL" $(for s in $REFSPECS; do printf '%s ' "${s%%:*}"; done) 'refs/tags/*' \
            | { grep -v '\^{}$' || true; } | awk '{print "+" $1 ":refs/copy/" substr($2, 6)}' > "$work/tips"
          tips_from=none
          if [ -s "$work/tips" ]; then
            if git fetch -q --no-tags --depth=1 "$SOURCE_URL" $(cat "$work/tips") 2>/dev/null; then
              tips_from=Forgejo
            else
              awk -F'[+:]' '{print "+refs/" substr($3, 11) ":" $3}' "$work/tips" > "$work/tip-refs"
              git fetch -q --no-tags --depth=1 "$COPY_URL" $(cat "$work/tip-refs")
              tips_from="the copy"
            fi
          fi
          mark "read $(awk 'END { print NR }' "$work/tips") copy tips from $tips_from"
          before="$(objects)"
          git fetch -q --no-tags "$SOURCE_URL" $REFSPECS '+refs/tags/*:refs/tags/*'
          mark "fetched $(( $(objects) - before )) objects from Forgejo"

          # Never --force, never --prune: a copy that diverged refuses, and the job fails.
          git push -q --porcelain "$COPY_URL" $REFSPECS 'refs/tags/*:refs/tags/*'
          mark "pushed"

          # Tip comparison: every pushed ref on the copy equals Forgejo's.
          git for-each-ref --format='%(objectname) %(refname)' refs/heads refs/tags | sort > "$work/forgejo"
          git ls-remote "$COPY_URL" $(for s in $REFSPECS; do printf '%s ' "${s%%:*}"; done) 'refs/tags/*' \
            | { grep -v '\^{}$' || true; } | awk '{print $1" "$2}' | sort > "$work/github"
          if ! diff -u "$work/forgejo" "$work/github"; then
            echo "github-copy: the GitHub copy differs from Forgejo" >&2
            exit 1
          fi
          echo "github-copy: $(wc -l < "$work/forgejo") refs equal on the GitHub copy"
